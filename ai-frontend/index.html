<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente BD - Sakila</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; height: 100vh; align-items: center; margin: 0; }
        .chat-container { width: 760px; max-width: 96vw; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; height: 90vh; }
        .chat-header { padding: 12px 15px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h1 { font-size: 16px; margin: 0; }
        .estado { font-size: 12px; padding: 4px 8px; border-radius: 12px; background: #e9ecef; color: #555; }
        .estado.ok { background: #d1f2dc; color: #1e6b36; }
        .estado.dummy { background: #fff3cd; color: #7a5b00; }
        .estado.error { background: #f8d7da; color: #842029; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #ddd; }
        .message { padding: 10px; border-radius: 6px; max-width: 85%; line-height: 1.4; white-space: pre-wrap; }
        .user { background: #007bff; color: white; align-self: flex-end; }
        .assistant { background: #e9ecef; color: #333; align-self: flex-start; }
        .pensando { font-style: italic; color: #777; }
        details.sql { margin-top: 8px; font-size: 12px; white-space: normal; }
        details.sql summary { cursor: pointer; color: #555; }
        details.sql pre { background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 8px; overflow-x: auto; white-space: pre-wrap; margin: 6px 0 0; }
        details.sql pre.fallo { border-color: #f1aeb5; }
        .sugerencias { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 10px 0; }
        .sugerencias button { font-size: 12px; padding: 6px 10px; border: 1px solid #007bff; background: white; color: #007bff; border-radius: 14px; cursor: pointer; text-align: left; }
        .sugerencias button:hover { background: #e7f1ff; }
        .input-area { display: flex; padding: 10px; background: #fff; }
        .input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; outline: none; }
        .input-area button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; margin-left: 5px; cursor: pointer; }
        .input-area button:hover { background: #0056b3; }
        .input-area button:disabled { background: #8bb9f0; cursor: wait; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h1>Agente BD · Sakila</h1>
            <span id="estado" class="estado">Conectando...</span>
        </div>
        <div id="chatBox" class="chat-box"></div>
        <div class="sugerencias">
            <button onclick="preguntar(this)">Recomiéndame 3 películas de acción que sean largas (más de 2 horas) pero que la gente alquile muy seguido en la tienda.</button>
            <button onclick="preguntar(this)">¿Qué clientes crees que están a punto de dejar el servicio porque llevan mucho tiempo sin alquilar ninguna película?</button>
            <button onclick="preguntar(this)">Hazme un análisis rápido de qué día de la semana hay más movimiento en las tiendas y cuánto dinero promedio se recauda en esos días.</button>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Pregúntale algo sobre la base de datos..." onkeypress="handleKeyPress(event)">
            <button id="sendBtn" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
